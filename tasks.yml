---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose-test
spec:
  steps:
    - name: run-unit-tests
      image: python:3.11
      script: |
        #!/bin/sh
        set -e
        echo "Install test dependency"
        pip install nose
        echo "Run unit tests"
        nosetests
