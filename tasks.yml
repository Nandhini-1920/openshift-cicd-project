
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  params:
    - name: WORKSPACE_SOURCE_PATH
      type: string
      default: /workspace/source
  steps:
    - name: remove-files
      image: alpine:3.20
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(params.WORKSPACE_SOURCE_PATH)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning workspace: ${WORKSPACE_SOURCE_PATH}"
        if [ -d "${WORKSPACE_SOURCE_PATH}" ]; then
          find "${WORKSPACE_SOURCE_PATH}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        fi
        echo "Cleanup completed successfully"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose-test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip
        pip install nose
        echo "Running unit tests with Nose"
        nosetests
